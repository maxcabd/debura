[package]
name = "debura-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "debura"
path = "src/main.rs"

[dependencies]
debura-core = { path = "../debura-core" }
debura-ghidra = { path = "../debura-ghidra" }
debura-analysis = { path = "../debura-analysis" }
debura-knowledge = { path = "../debura-knowledge" }
debura-storage = { path = "../debura-storage" }
debura-agent = { path = "../debura-agent", features = ["openai"] }
debura-verifier = { path = "../debura-verifier" }
debura-scheduler = { path = "../debura-scheduler" }
debura-recovery = { path = "../debura-recovery" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
chrono.workspace = true
